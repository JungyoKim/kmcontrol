# kmc-agent 는 kmc-streamhost 를 통해 ffmpeg-sys-next 를 빌드하므로 같은 env 가 필요하다.
# cargo 는 **현재 디렉터리**에서 위로 올라가며 config 를 찾을 뿐 의존 크레이트의
# `.cargo/config.toml` 은 읽지 않는다. 워크스페이스 루트가 없어 크레이트마다 따로 둔다.
#
# FFMPEG_DIR: 시스템 ffmpeg shared 빌드(include/ + lib/).
# LIBCLANG_PATH: bindgen이 쓰는 libclang.dll (pip libclang 휠 제공).
[env]
FFMPEG_DIR = "C:\\Users\\G433m\\ffmpeg-7.1-shared"
LIBCLANG_PATH = "C:\\Users\\G433m\\.pyenv\\pyenv-win\\versions\\3.13.7\\Lib\\site-packages\\clang\\native"
